<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#0d1c2c"/>
    </linearGradient>
    <linearGradient id="voice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#7c5cf0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="rglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#rbg)"/>
  <circle cx="390" cy="360" r="300" fill="url(#rglow)"/>
  <circle cx="1120" cy="150" r="220" fill="url(#rglow)"/>

  <!-- window -->
  <rect x="120" y="92" width="1040" height="536" rx="24" fill="#0b1a2b" stroke="#1c3550" stroke-width="1.5"/>
  <circle cx="156" cy="126" r="6" fill="#ff5f56"/>
  <circle cx="178" cy="126" r="6" fill="#ffbd2e"/>
  <circle cx="200" cy="126" r="6" fill="#27c93f"/>

  <!-- header -->
  <rect x="152" y="160" width="46" height="46" rx="12" fill="url(#voice)"/>
  <rect x="169" y="172" width="12" height="18" rx="6" fill="#0a1420"/>
  <path d="M164 186 a11 11 0 0 0 22 0 M175 197 v6" stroke="#0a1420" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="212" y="182" fill="#ffffff" font-size="25" font-weight="700">AI Restaurant Voice Assistant</text>
  <text x="213" y="203" fill="#7f9bb8" font-size="14">Voice-first ordering &amp; live operations control</text>
  <rect x="1000" y="168" width="130" height="34" rx="17" fill="#0c2a1c" stroke="#1f6f43"/>
  <circle cx="1022" cy="185" r="5" fill="#34d399"/>
  <text x="1036" y="190" fill="#5fe0a0" font-size="13" font-weight="600">OPEN</text>

  <!-- ===== Left: voice panel ===== -->
  <rect x="152" y="232" width="470" height="330" rx="16" fill="#07131f" stroke="#16304a"/>

  <circle cx="387" cy="330" r="110" fill="none" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="387" cy="330" r="88" fill="none" stroke="#2dd4bf" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="387" cy="330" r="64" fill="url(#voice)"/>
  <rect x="378" y="306" width="18" height="30" rx="9" fill="#ffffff"/>
  <path d="M366 332 a21 21 0 0 0 42 0 M387 353 v12 M375 368 h24" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- equalizer -->
  <g fill="#2dd4bf">
    <rect x="300" y="438" width="6" height="16" rx="3"/>
    <rect x="314" y="430" width="6" height="24" rx="3"/>
    <rect x="328" y="420" width="6" height="34" rx="3"/>
    <rect x="342" y="410" width="6" height="44" rx="3"/>
    <rect x="356" y="424" width="6" height="30" rx="3"/>
    <rect x="370" y="404" width="6" height="50" rx="3"/>
    <rect x="384" y="416" width="6" height="38" rx="3"/>
    <rect x="398" y="402" width="6" height="52" rx="3"/>
    <rect x="412" y="422" width="6" height="32" rx="3"/>
    <rect x="426" y="412" width="6" height="42" rx="3"/>
    <rect x="440" y="428" width="6" height="26" rx="3"/>
    <rect x="454" y="436" width="6" height="18" rx="3"/>
    <rect x="468" y="432" width="6" height="22" rx="3"/>
  </g>

  <!-- transcript -->
  <rect x="176" y="482" width="422" height="60" rx="12" fill="#0e2233" stroke="#1c3f57"/>
  <text x="196" y="507" fill="#8fb0cf" font-size="11" letter-spacing="1">CUSTOMER · SPEAKING</text>
  <text x="196" y="528" fill="#eaf4ff" font-size="14" font-weight="600">“Two Zinger Burgers and a Coke”</text>

  <!-- ===== Right: live order ===== -->
  <rect x="648" y="232" width="360" height="228" rx="16" fill="#102237" stroke="#1e3a5f"/>
  <text x="672" y="264" fill="#7f9bb8" font-size="12" letter-spacing="1.5">LIVE ORDER</text>

  <text x="672" y="300" fill="#eaf2ff" font-size="15" font-weight="600">2× Zinger Burger</text>
  <text x="984" y="300" fill="#cfe0f2" font-size="15" text-anchor="end">$11.98</text>
  <text x="672" y="332" fill="#eaf2ff" font-size="15" font-weight="600">1× Coca-Cola</text>
  <text x="984" y="332" fill="#cfe0f2" font-size="15" text-anchor="end">$1.99</text>

  <line x1="672" y1="352" x2="984" y2="352" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="672" y="390" fill="#ffffff" font-size="17" font-weight="700">Total</text>
  <text x="984" y="392" fill="#5fe0c8" font-size="22" font-weight="800" text-anchor="end">$13.97</text>

  <rect x="672" y="412" width="150" height="30" rx="15" fill="#33270f" stroke="#a8781f"/>
  <circle cx="690" cy="427" r="4" fill="#f6a94b"/>
  <text x="702" y="432" fill="#ffcf8a" font-size="12.5" font-weight="600">Order building…</text>

  <!-- status + persona small cards -->
  <rect x="648" y="476" width="174" height="66" rx="14" fill="#102237" stroke="#1e3a5f"/>
  <text x="668" y="504" fill="#7f9bb8" font-size="11" letter-spacing="1">STATUS</text>
  <rect x="668" y="512" width="44" height="20" rx="10" fill="#1f6f43"/>
  <circle cx="702" cy="522" r="8" fill="#5fe0a0"/>
  <text x="724" y="527" fill="#eaf2ff" font-size="13" font-weight="600">Open</text>

  <rect x="834" y="476" width="174" height="66" rx="14" fill="#102237" stroke="#1e3a5f"/>
  <text x="854" y="504" fill="#7f9bb8" font-size="11" letter-spacing="1">AI VOICE</text>
  <circle cx="862" cy="524" r="6" fill="#7c5cf0"/>
  <text x="876" y="529" fill="#eaf2ff" font-size="13" font-weight="600">ElevenLabs · Rachel</text>

  <!-- tech pills -->
  <g font-size="12.5" font-weight="600">
    <rect x="152" y="574" width="96" height="30" rx="15" fill="#0f2137" stroke="#254a6e"/>
    <text x="200" y="594" fill="#9cc0e0" text-anchor="middle">LangGraph</text>
    <rect x="260" y="574" width="78" height="30" rx="15" fill="#0f2137" stroke="#254a6e"/>
    <text x="299" y="594" fill="#9cc0e0" text-anchor="middle">LiveKit</text>
    <rect x="350" y="574" width="132" height="30" rx="15" fill="#0f2137" stroke="#254a6e"/>
    <text x="416" y="594" fill="#9cc0e0" text-anchor="middle">Groq · Llama 3.1</text>
    <rect x="494" y="574" width="98" height="30" rx="15" fill="#0f2137" stroke="#254a6e"/>
    <text x="543" y="594" fill="#9cc0e0" text-anchor="middle">Deepgram</text>
    <rect x="604" y="574" width="104" height="30" rx="15" fill="#0f2137" stroke="#254a6e"/>
    <text x="656" y="594" fill="#9cc0e0" text-anchor="middle">ElevenLabs</text>
    <rect x="720" y="574" width="84" height="30" rx="15" fill="#0f2137" stroke="#254a6e"/>
    <text x="762" y="594" fill="#9cc0e0" text-anchor="middle">FastAPI</text>
    <rect x="816" y="574" width="72" height="30" rx="15" fill="#0f2137" stroke="#254a6e"/>
    <text x="852" y="594" fill="#9cc0e0" text-anchor="middle">React</text>
    <rect x="900" y="574" width="98" height="30" rx="15" fill="#0f2137" stroke="#254a6e"/>
    <text x="949" y="594" fill="#9cc0e0" text-anchor="middle">Supabase</text>
  </g>
</svg>
